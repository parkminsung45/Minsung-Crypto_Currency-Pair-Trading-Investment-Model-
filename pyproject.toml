[project]
name = "upbit-spread-rl"
version = "0.1.0"
description = "Upbit pair-spread & quote-spread trading via reinforcement learning"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "websockets>=12.0",
    "pyjwt>=2.8",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
